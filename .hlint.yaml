# 警告対象外のものの理由
# - `return`: `pure`の代わりに`return`を使うのは好みの問題
# - `isJust`/`fromJust`パターン: hlintデフォルトで提案される
# - ゼロ除算(`div`, `mod`等): 排除不可能、型レベル保証には依存型が必要
# - `fromIntegral`, `realToFrac`: 代替手段が常に使えるわけではない
