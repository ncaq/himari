# himari hlint configuration
# himariが推奨するスタイルを機械的にチェックするためのhlint設定ファイルです。
#
# 使い方:
#   このファイル(`.hlint.yaml`)と`.hlint/`ディレクトリをプロジェクトルートにコピーしてください。
#
# 部分関数や危険な関数の使用を警告したり、
# より可読性の高いパターンを提案します。

# 分割ファイルの読み込み
- arguments:
    - --hint=.hlint/bits.yaml
    - --hint=.hlint/bytestring.yaml
    - --hint=.hlint/concurrency.yaml
    - --hint=.hlint/containers.yaml
    - --hint=.hlint/convertible.yaml
    - --hint=.hlint/exceptions.yaml
    - --hint=.hlint/partial.yaml
    - --hint=.hlint/performance.yaml
    - --hint=.hlint/string-io.yaml
    - --hint=.hlint/text.yaml
    - --hint=.hlint/typed-process.yaml
    - --hint=.hlint/unliftio.yaml
    - --hint=.hlint/unsafe.yaml
    - --hint=.hlint/vector.yaml

# 警告対象外のものの理由:
# - `isJust`/`fromJust`パターン: hlintデフォルトで提案される
# - ゼロ除算(`div`, `mod`等): 排除不可能、型レベル保証には依存型が必要
# - `fromIntegral`, `realToFrac`: 代替手段が常に使えるわけではない

# グループ有効化

# `feature`グループは`pure`の代わりに`return`を使うのは好みの問題のため無効化します。
# `partial`グループは`NonEmpty.head`等も誤検出するため無効化し、個別に設定します。

# `map` → `fmap`, `++` → `<>` などの汎用化
- group:
    name: generalise
    enabled: true

# `a $ b $ c` → `a . b $ c` (関数合成スタイル)
- group:
    name: dollar
    enabled: true

# `either Just (const Nothing)` → `preview _Left` など
- group:
    name: use-lens
    enabled: true

# `TH.varE 'a` → `[| a |]`
- group:
    name: use-th-quotes
    enabled: true
