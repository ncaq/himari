    lhs: Data.Text.Lazy.Encoding.encodeUtf8
    rhs: convert
    note: "Use convert from Data.Convertible for uniform type conversion"
- hint:
    lhs: Data.Text.Lazy.Encoding.decodeUtf8
    rhs: convert
    note: "Use convert from Data.Convertible for uniform type conversion"

# `Data.ByteString`(Strict)
