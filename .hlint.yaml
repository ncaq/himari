    rhs: convert
    note: "Use convert from Data.Convertible for uniform type conversion"
- hint:
    lhs: Data.ByteString.unpack
    rhs: convert
    note: "Use convert from Data.Convertible for uniform type conversion"

# `Data.ByteString.Lazy`
