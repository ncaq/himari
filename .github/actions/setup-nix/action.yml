name: Setup Nix
description: Install Nix and configure caches

inputs:
  cachix-auth-token:
    description: Cachix authentication token
    required: false
    default: ""
  free-disk-space:
    description: Free disk space before setup (Linux only)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: jlumbroso/free-disk-space@v1.3.1
      if: inputs.free-disk-space == 'true' && runner.os == 'Linux'
      with:
        tool-cache: false # GitHub Actionsのツールキャッシュは残す
        android: true
        docker-images: true
        dotnet: true
        haskell: true # Nixで管理しているので不要
        large-packages: false # ARMランナーに存在しないパッケージ削除で警告が出るため無効化
        swap-storage: true

    - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31
      with:
        extra_nix_config: >
          extra-substituters =
          https://cache.nixos.org/
          https://niks3-public.ncaq.net/
          https://ncaq.cachix.org/
          https://nix-community.cachix.org/
          https://cache.iog.io/

          extra-trusted-public-keys =
          cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          niks3-public.ncaq.net-1:e/B9GomqDchMBmx3IW/TMQDF8sjUCQzEofKhpehXl04=
          ncaq.cachix.org-1:XF346GXI2n77SB5Yzqwhdfo7r0nFcZBaHsiiMOEljiE=
          nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
          hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=

    - name: Setup Cachix cache
      if: inputs.cachix-auth-token != ''
      uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
      with:
        name: ncaq
        authToken: "${{ inputs.cachix-auth-token }}"
