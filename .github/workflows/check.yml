name: check

on:
  push:
    branches: [master, main]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-flake-check:
    name: nix-flake-check
    strategy:
      matrix:
        os:
          - ubuntu-24.04 # x86_64-linux
          - ubuntu-24.04-arm # aarch64-linux
          - macos-15 # Apple Silicon (aarch64-darwin)
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # Read repository contents
      id-token: write # niks3 OIDC authentication
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ncaq/nix-composite-action@9ecb278bd92662648714839d5013ffcd37c7383f # v1.2.0
        with:
          cachix-auth-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix flake check

  windows:
    name: windows
    runs-on: windows-2025
    permissions:
      contents: read # Read repository contents
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # バージョンは一つに絞られてしまいますが、他のnix-flake-checkジョブで十分カバーできているので問題ありません。
      - name: Extract GHC version from cabal.project
        id: ghc
        shell: bash
        run: |
          VERSION=$(sed -n 's/^with-compiler: ghc-//p' cabal.project)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2.11.0
        id: setup
        with:
          ghc-version: ${{ steps.ghc.outputs.version }}
      - name: Configure and generate build plan
        run: |
          cabal configure --disable-optimization --enable-tests
          cabal build all --dry-run
      - name: Restore cached dependencies
        id: cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-plan-${{ hashFiles('**/plan.json') }} # editorconfig-checker-disable-line
          restore-keys: |
            ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-
      - run: cabal test --disable-optimization --enable-tests
      - name: Save dependencies to cache
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

  format:
    name: format # nix flake checkで実行されるnix fmtで対応していない範囲のフォーマットチェックを行う。
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Read repository contents
      id-token: write # niks3 OIDC authentication
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ncaq/nix-composite-action@9ecb278bd92662648714839d5013ffcd37c7383f # v1.2.0
        with:
          cachix-auth-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: generate-hlint
        run: nix run '.#generate-hlint'
      - run: git diff --exit-code
