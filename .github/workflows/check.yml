name: check

on:
  push:
    branches: [master, main]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-flake-check:
    name: nix-flake-check
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04 # x86_64-linux
          - ubuntu-24.04-arm # aarch64-linux
          - macos-15 # aarch64-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # Read repository contents
      id-token: write # niks3 OIDC authentication
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ncaq/nix-composite-action@2b72ad0c744a271852bfb65830a6ab6818e1aacd # v3.0.4
      - run: nix flake check

  windows:
    name: windows
    runs-on: windows-2025
    permissions:
      contents: read # Read repository contents
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # バージョンは一つに絞られてしまいますが、
      # 他のnix-flake-checkジョブで十分カバーできているので問題ありません。
      - name: Extract GHC version from cabal.project
        id: ghc
        shell: bash
        run: |
          VERSION=$(sed -n 's/^with-compiler: ghc-//p' cabal.project)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
        id: setup
        with:
          ghc-version: ${{ steps.ghc.outputs.version }}
      - name: Configure and generate build plan
        run: |
          cabal configure --disable-optimization --enable-tests
          cabal build all --dry-run
      - name: Restore cached dependencies
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-plan-${{ hashFiles('**/plan.json') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-
      - run: cabal test --disable-optimization --enable-tests
      - name: Save dependencies to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # `nix flake check`で対応していないチェックを行う。
  format:
    name: format
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Read repository contents
      id-token: write # niks3 OIDC authentication
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ncaq/nix-composite-action@2b72ad0c744a271852bfb65830a6ab6818e1aacd # v3.0.4
      - name: generate-hlint
        run: nix run '.#generate-hlint'
      - run: git diff --exit-code
