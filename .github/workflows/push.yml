name: push

on:
  workflow_dispatch:
  push:
    branches: master
  pull_request:

permissions:
  contents: read

jobs:
  nix-flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false # GitHub Actionsのツールキャッシュは残す
          android: true
          docker-images: true
          dotnet: true
          haskell: true # Nixで管理しているので不要
          large-packages: true
          swap-storage: true
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v16
        with:
          name: himari
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix flake check

  format: # `nix flake check`で実行される`nix fmt`で対応していない範囲のフォーマットチェックを行う。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v16
        with:
          name: himari
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: editorconfig-checker
        run: nix run 'nixpkgs#editorconfig-checker' -- -config .editorconfig-checker.json
      - run: cabal check
      - name: generate-hlint
        run: nix run '.#generate-hlint'
      - run: git diff --exit-code

  release:
    needs: [nix-flake-check, format]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # タグ作成のため
    # masterへのpushまたはworkflow_dispatchの場合のみ実行
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Extract version from cabal
        id: version
        run: |
          set -euo pipefail
          if [ ! -f himari.cabal ]; then
            echo "himari.cabal not found"
            exit 1
          fi
          VERSION=$(grep -m1 '^version:' himari.cabal | awk '{print $2}')
          if [ -z "${VERSION:-}" ]; then
            echo "Failed to extract version from himari.cabal"
            exit 1
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Invalid PVP version format: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check if tag exists
        id: check_tag
        run: |
          set -euo pipefail
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # 以降はタグが存在しない場合のみ実行
      - uses: jlumbroso/free-disk-space@v1.3.1
        if: steps.check_tag.outputs.exists == 'false'
        with:
          tool-cache: false
          android: true
          docker-images: true
          dotnet: true
          haskell: true # Nixで管理しているので不要
          large-packages: true
          swap-storage: true
      - uses: cachix/install-nix-action@v31
        if: steps.check_tag.outputs.exists == 'false'
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v16
        if: steps.check_tag.outputs.exists == 'false'
        with:
          name: himari
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # ビルドを先に実行して、成功した場合のみタグとリリースを作成する
      - name: Build sdist
        if: steps.check_tag.outputs.exists == 'false'
        run: nix develop --command cabal sdist
      - name: Build documentation for Hackage
        if: steps.check_tag.outputs.exists == 'false'
        run: nix develop --command cabal haddock --haddock-for-hackage
      - name: Create tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        run: gh release create "v${{ steps.version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to Hackage
        if: steps.check_tag.outputs.exists == 'false'
        uses: haskell-actions/hackage-publish@v1.1
        with:
          hackageToken: ${{ secrets.HACKAGE_AUTH_TOKEN }}
          packagesPath: dist-newstyle/sdist/
          docsPath: dist-newstyle/
          publish: true
