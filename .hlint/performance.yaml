# パフォーマンス問題警告
# パフォーマンス上の問題がある関数を警告します。

- functions:
    - name: nub
      within: []
      message: "O(n^2) complexity. Use ordNub or nubOrd instead."
    - name: foldl
      within: []
      message: "Lazy accumulator causes space leaks. Use foldl' instead."
    - name: genericLength
      within: []
      message: "O(n) stack space. Use length with explicit conversion."
