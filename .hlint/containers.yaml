# Map/HashMap部分関数警告
# Data.MapおよびData.HashMapの部分関数を警告します。

- functions:
    - name: "Data.Map.!"
      within: []
      message: "Use Data.Map.lookup or Data.Map.!? instead"
    - name: Data.Map.findMin
      within: []
      message: "Use Data.Map.lookupMin instead"
    - name: Data.Map.findMax
      within: []
      message: "Use Data.Map.lookupMax instead"
    - name: "Data.HashMap.Strict.!"
      within: []
      message: "Use Data.HashMap.lookup instead"
    - name: "Data.HashMap.Lazy.!"
      within: []
      message: "Use Data.HashMap.lookup instead"
