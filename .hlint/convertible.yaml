# convertible推奨ルール
# 各種文字列変換関数の代わりにData.Convertible.convert関数を使うことを推奨します。
# convertを使うと型変換が統一的になり、コードの可読性が向上します。

# Data.Text(Strict)
- hint:
    lhs: Data.Text.pack
    rhs: convert
    note: "Use convert from Data.Convertible for uniform type conversion"
- hint:
    lhs: Data.Text.unpack
    rhs: convert
    note: "Use convert from Data.Convertible for uniform type conversion"

