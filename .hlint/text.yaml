# Data.Text部分関数警告
# Data.TextのStrict/Lazyバージョンの部分関数を警告します。

# Data.Text部分関数(Strict)
- functions:
    - name: Data.Text.head
      within: []
      message: "Use Data.Text.uncons instead"
    - name: Data.Text.tail
      within: []
      message: "Use Data.Text.uncons instead"
    - name: Data.Text.init
      within: []
      message: "Use Data.Text.unsnoc instead"
    - name: Data.Text.last
      within: []
      message: "Use Data.Text.unsnoc instead"
    - name: Data.Text.maximum
      within: []
      message: "Partial: throws on empty Text. Use fold with explicit initial value."
    - name: Data.Text.minimum
      within: []
      message: "Partial: throws on empty Text. Use fold with explicit initial value."

# Data.Text.Lazy部分関数
- functions:
